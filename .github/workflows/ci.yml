name: ci

# 受け入れゲート(design 08 §4)の自動化:
#  - 全 --json 出力が schemas/ に valid (drift_test / config_test / publish_test / status_test)
#  - registry 不整合・next: リンク切れ・コード不整合で落ちる (drift_test / codes_test)
# test ジョブは goreleaser/ネットワーク不要(Builder/Archiver/TapStore を fake 化済み)。
# docker-verify ジョブだけは実 docker と実ネットワークを使う。
# windows-test / macos-test ジョブは、その OS でしか走らないコードを走らせるためだけに在る。
# wharfy が配布を語る OS は、CI が実際に踏む(D-11)。語るだけで踏まない OS を残さない。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod   # go.mod の go ディレクティブ(=サポート下限)で検証
          cache: true

      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: go test -race ./...

  # Windows でしか踏めない経路を守る。install.ps1 の本文は ubuntu の pwsh でも走る(ランナーに
  # PowerShell 7 が入っている)が、利用者の大半が使う Windows PowerShell 5.1 と、.exe を置いて
  # 起動するまでのパス処理は、ここでしか走らない。v0.16.0 が壊れた install.ps1 を配った穴である。
  # このランナーには 5.1 と 7 の両方が在り、install.ps1 のテストはその両方で走る
  # (TestRunPowerShellInstallRunsTheRealPS1 の対応表を見よ)。
  # test ジョブとは別に置く: windows ランナーは遅いので、軽い test を待たせない。
  # -race を付けないのは意図的で、競合は OS に依らないから ubuntu の test ジョブが見る。
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...

  # macOS でしか踏めない経路を守る。install.sh を実際に走らせるテストは ubuntu では GNU coreutils で
  # 通るが、macOS の利用者が踏むのは BSD の install / tar / uname で、uname -m の答えも違う(arm64)。
  # wharfy が自分自身を配っている主チャネルは Homebrew(macOS)であり、そこが手元でしか踏まれて
  # いなかった。test ジョブとは別に置く理由は windows-test と同じ。
  macos-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...

  # 実 docker で deb/rpm を本当に install して起動まで踏む(build tag dockerverify)。
  # test ジョブとは別に置く: イメージ取得と install で分単位かかるので、軽い test を待たせない。
  # repo はホストの LAN アドレスで配るため、コンテナ → ホストの到達性がこのジョブの前提になる。
  docker-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test (dockerverify)
        run: go test -tags dockerverify ./cmd/wharfy/ -run TestDockerVerify -timeout 20m
